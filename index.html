<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Ripple Field</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #05060e;
    color: #dfe6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas.scene { display: block; }

  #hud {
    position: fixed;
    top: 18px;
    left: 20px;
    pointer-events: none;
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #cdd8ff;
  }
  #status {
    font-size: 13px;
    color: #8fa0c8;
    transition: color 0.3s;
  }
  #status.tracking { color: #7ef0c9; }
  #status.error { color: #ff9d9d; }

  #hint {
    position: fixed;
    bottom: 16px;
    left: 20px;
    font-size: 12px;
    color: #5d6a8f;
    pointer-events: none;
    user-select: none;
  }

  #camWrap {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  #preview {
    width: 176px;
    height: 132px;
    border-radius: 10px;
    border: 1px solid rgba(150, 170, 255, 0.25);
    background: #0a0c18;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  }
  #camWrap.hidden #preview { display: none; }
  #toggleCam {
    pointer-events: auto;
    font: 11px system-ui, sans-serif;
    color: #93a3cc;
    background: rgba(20, 24, 44, 0.7);
    border: 1px solid rgba(150, 170, 255, 0.2);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #toggleCam:hover { color: #d7e0ff; }

  video#cam {
    position: absolute;
    width: 640px;
    height: 480px;
    visibility: hidden;
    pointer-events: none;
  }

  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    font-size: 15px;
    color: #ffb0b0;
    text-align: center;
    padding: 24px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="hud">
    <h1>Ripple Field</h1>
    <div id="status">warming up…</div>
  </div>
  <div id="hint">wave a hand — speed &amp; direction shape the splash · move the mouse works too · press C to toggle camera view</div>
  <div id="camWrap">
    <canvas id="preview" width="352" height="264"></canvas>
    <button id="toggleCam">hide camera</button>
  </div>
  <video id="cam" playsinline muted></video>
  <div id="fatal"></div>

<script type="module">
import * as THREE from 'three';

const SIM_RES = 512;        // water simulation texture resolution
const SIM_HZ = 120;         // fixed simulation steps per second
const MAX_SPLATS = 24;      // max ripple impulses applied per sim frame

const statusEl = document.getElementById('status');
function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className = cls;
}
function fatal(text) {
  const el = document.getElementById('fatal');
  el.textContent = text;
  el.style.display = 'grid';
}

// ---------------------------------------------------------------- renderer
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (err) {
  fatal('WebGL2 is not available in this browser — the water cannot be simulated here.');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.domElement.classList.add('scene');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060e);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 120);
camera.position.set(0, 8.2, 3.4);
camera.lookAt(0, 0, -0.6);

// ------------------------------------------------------- simulation targets
// Heightfield wave equation on three ping-pong half-float targets:
//   next = (neighbors average) * 2 - previous, damped, plus injected splats.
function makeTarget() {
  const rt = new THREE.WebGLRenderTarget(SIM_RES, SIM_RES, {
    type: THREE.HalfFloatType,
    format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false,
    generateMipmaps: false,
  });
  return rt;
}
const targets = [makeTarget(), makeTarget(), makeTarget()];
let iPrev = 0, iCurr = 1, iNext = 2;

const simScene = new THREE.Scene();
const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const simMaterial = new THREE.ShaderMaterial({
  defines: { MAX_SPLATS },
  uniforms: {
    uCurr: { value: null },
    uPrev: { value: null },
    uTexel: { value: new THREE.Vector2(1 / SIM_RES, 1 / SIM_RES) },
    uDamping: { value: 0.994 },
    uAspect: { value: 1 },
    uSplatCount: { value: 0 },
    uSplats: { value: Array.from({ length: MAX_SPLATS }, () => new THREE.Vector4()) },
    uSplatDirs: { value: Array.from({ length: MAX_SPLATS }, () => new THREE.Vector2()) },
  },
  depthTest: false,
  depthWrite: false,
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uCurr;
    uniform sampler2D uPrev;
    uniform vec2 uTexel;
    uniform float uDamping;
    uniform float uAspect;
    uniform int uSplatCount;
    uniform vec4 uSplats[MAX_SPLATS];    // xy: center uv, z: amplitude, w: radius
    uniform vec2 uSplatDirs[MAX_SPLATS]; // directional (dipole) push along motion

    void main() {
      float p = texture2D(uPrev, vUv).r;
      float l = texture2D(uCurr, vUv - vec2(uTexel.x, 0.0)).r;
      float r = texture2D(uCurr, vUv + vec2(uTexel.x, 0.0)).r;
      float d = texture2D(uCurr, vUv - vec2(0.0, uTexel.y)).r;
      float u = texture2D(uCurr, vUv + vec2(0.0, uTexel.y)).r;

      float next = (l + r + u + d) * 0.5 - p;
      next *= uDamping;

      for (int i = 0; i < MAX_SPLATS; i++) {
        if (i >= uSplatCount) break;
        vec2 off = vUv - uSplats[i].xy;
        off.x *= uAspect;
        float sig = uSplats[i].w;
        float g = exp(-dot(off, off) / (sig * sig));
        next += uSplats[i].z * g;                     // volume push (amplitude)
        next += dot(off / sig, uSplatDirs[i]) * g;    // bow wave along motion
      }

      // soften the pool walls so reflections fade instead of ringing forever
      float edge = smoothstep(0.0, 0.05, vUv.x) * smoothstep(0.0, 0.05, 1.0 - vUv.x)
                 * smoothstep(0.0, 0.05, vUv.y) * smoothstep(0.0, 0.05, 1.0 - vUv.y);
      next *= mix(0.86, 1.0, edge);

      gl_FragColor = vec4(clamp(next, -3.0, 3.0), 0.0, 0.0, 1.0);
    }
  `,
});
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMaterial));

renderer.setClearColor(0x000000, 1);
for (const rt of targets) {
  renderer.setRenderTarget(rt);
  renderer.clear();
}
renderer.setRenderTarget(null);

// ------------------------------------------------------------ water surface
const waterMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uHeight: { value: targets[iCurr].texture },
    uTexel: { value: new THREE.Vector2(1 / SIM_RES, 1 / SIM_RES) },
    uDisp: { value: 0.42 },
    uNormalGain: { value: 3.0 },
    uWorldSize: { value: new THREE.Vector2(1, 1) },
    uCamPos: { value: camera.position },
    uTime: { value: 0 },
  },
  vertexShader: /* glsl */`
    uniform sampler2D uHeight;
    uniform float uDisp;
    varying vec2 vUv;
    varying vec3 vWorld;
    void main() {
      vUv = uv;
      vec3 p = position;
      p.z += texture2D(uHeight, uv).r * uDisp;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D uHeight;
    uniform vec2 uTexel;
    uniform float uDisp;
    uniform float uNormalGain;
    uniform vec2 uWorldSize;
    uniform vec3 uCamPos;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vWorld;

    vec3 palette(float t) {
      // teal (calm) -> blue -> violet -> pink (crests / grazing angles)
      return vec3(0.36, 0.34, 0.42)
           + vec3(0.42, 0.30, 0.38) * cos(6.28318 * (t + vec3(0.05, 0.55, 0.25)));
    }

    void main() {
      float hC = texture2D(uHeight, vUv).r;
      float hL = texture2D(uHeight, vUv - vec2(uTexel.x, 0.0)).r;
      float hR = texture2D(uHeight, vUv + vec2(uTexel.x, 0.0)).r;
      float hD = texture2D(uHeight, vUv - vec2(0.0, uTexel.y)).r;
      float hU = texture2D(uHeight, vUv + vec2(0.0, uTexel.y)).r;

      float dhdx = (hR - hL) * uDisp * uNormalGain / (2.0 * uTexel.x * uWorldSize.x);
      float dhdz = -(hU - hD) * uDisp * uNormalGain / (2.0 * uTexel.y * uWorldSize.y);
      vec3 n = normalize(vec3(-dhdx, 1.0, -dhdz));

      vec3 V = normalize(uCamPos - vWorld);
      float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);

      float hs = clamp(hC, -1.2, 1.2);
      float t = 0.55 + hs * 0.10 + fres * 0.45 + vUv.y * 0.04 + 0.03 * sin(uTime * 0.12);
      vec3 film = palette(t);

      vec3 deep = vec3(0.008, 0.014, 0.05);
      vec3 col = mix(deep, film, clamp(0.16 + fres * 0.95 + abs(hs) * 0.5, 0.0, 1.0));

      vec3 L = normalize(vec3(-0.35, 0.9, 0.45));
      vec3 H = normalize(L + V);
      col += vec3(1.0, 0.96, 1.0) * pow(max(dot(n, H), 0.0), 120.0) * 0.9;
      col += film * smoothstep(0.05, 0.9, hs) * 0.35;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const waterMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 256, 256), waterMaterial);
waterMesh.rotation.x = -Math.PI / 2;
scene.add(waterMesh);

// The water plane is fitted to exactly cover the view, so a hand position in
// camera space maps 1:1 onto the visible surface.
const worldRect = { w: 1, h: 1, cx: 0, cz: 0 };
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function fitPlaneToView() {
  camera.updateMatrixWorld(true);
  const rc = new THREE.Raycaster();
  const pt = new THREE.Vector3();
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const [x, y] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    rc.setFromCamera(new THREE.Vector2(x, y), camera);
    if (rc.ray.intersectPlane(groundPlane, pt)) {
      minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
      minZ = Math.min(minZ, pt.z); maxZ = Math.max(maxZ, pt.z);
    }
  }
  worldRect.w = (maxX - minX) * 1.03;
  worldRect.h = (maxZ - minZ) * 1.03;
  worldRect.cx = (minX + maxX) / 2;
  worldRect.cz = (minZ + maxZ) / 2;
  waterMesh.scale.set(worldRect.w, worldRect.h, 1);
  waterMesh.position.set(worldRect.cx, 0, worldRect.cz);
  waterMaterial.uniforms.uWorldSize.value.set(worldRect.w, worldRect.h);
  simMaterial.uniforms.uAspect.value = worldRect.w / worldRect.h;
}

function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  fitPlaneToView();
}
window.addEventListener('resize', onResize);
onResize();

// ------------------------------------------------------------- splat queue
const splatQueue = [];
let lastInteraction = performance.now();

// u, v in [0,1] across the water; du, dv is motion direction; speed in uv/s
function addSplat(u, v, speed, du, dv, base = -1) {
  if (splatQueue.length >= MAX_SPLATS) return;
  const amp = base * Math.min(0.1 + speed * 0.28, 1.0);
  const radius = 0.016 + Math.min(speed * 0.009, 0.022);
  const len = Math.hypot(du, dv);
  const aspect = simMaterial.uniforms.uAspect.value;
  let dx = 0, dy = 0;
  if (len > 1e-5) {
    // match the aspect-corrected space the shader measures distance in
    const ax = du * aspect, ay = dv;
    const alen = Math.hypot(ax, ay);
    const push = Math.min(speed * 0.30, 1.1);
    dx = (ax / alen) * push;
    dy = (ay / alen) * push;
  }
  splatQueue.push({ u, v, amp, radius, dx, dy });
  lastInteraction = performance.now();
}

// Spawn a trail of splats along a movement segment so fast swipes leave a
// continuous wake instead of dotted rings.
function addStroke(pu, pv, u, v, dt) {
  const du = u - pu, dv = v - pv;
  const dist = Math.hypot(du, dv);
  const speed = dist / Math.max(dt, 1 / 240);
  if (speed < 0.035) return;
  const steps = Math.min(Math.ceil(dist / 0.03), 6);
  for (let s = 1; s <= steps; s++) {
    const f = s / steps;
    addSplat(pu + du * f, pv + dv * f, speed / Math.sqrt(steps), du, dv);
  }
}

// --------------------------------------------------------------- hand input
const video = document.getElementById('cam');
const preview = document.getElementById('preview');
const pctx = preview.getContext('2d');
const camWrap = document.getElementById('camWrap');
const toggleBtn = document.getElementById('toggleCam');

let landmarker = null;
let camReady = false;
let lastVideoTime = -1;
let latestHands = [];
const trackedHands = new Map(); // hand index -> {u, v, t}

function toggleCamView() {
  camWrap.classList.toggle('hidden');
  toggleBtn.textContent = camWrap.classList.contains('hidden') ? 'show camera' : 'hide camera';
}
toggleBtn.addEventListener('click', toggleCamView);
window.addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') toggleCamView();
});

async function initHandTracking() {
  setStatus('loading hand tracker…');
  const { FilesetResolver, HandLandmarker } = await import(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
  );
  const fileset = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  const options = (delegate) => ({
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate,
    },
    runningMode: 'VIDEO',
    numHands: 2,
    minHandDetectionConfidence: 0.4,
    minHandPresenceConfidence: 0.4,
    minTrackingConfidence: 0.4,
  });
  try {
    landmarker = await HandLandmarker.createFromOptions(fileset, options('GPU'));
  } catch {
    landmarker = await HandLandmarker.createFromOptions(fileset, options('CPU'));
  }

  setStatus('requesting camera…');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
  camReady = true;
  setStatus('wave a hand over the water ✋');
}
initHandTracking().catch((err) => {
  console.warn('hand tracking unavailable:', err);
  setStatus('camera unavailable — move your mouse to ripple the water', 'error');
});

// Palm center: average of wrist and the four finger base knuckles.
const PALM_POINTS = [0, 5, 9, 13, 17];

function processHands(now) {
  if (!landmarker || !camReady || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const result = landmarker.detectForVideo(video, now);
  latestHands = result.landmarks || [];

  const seen = new Set();
  latestHands.forEach((lm, i) => {
    seen.add(i);
    let px = 0, py = 0;
    for (const idx of PALM_POINTS) { px += lm[idx].x; py += lm[idx].y; }
    px /= PALM_POINTS.length; py /= PALM_POINTS.length;

    // mirror the camera so moving your hand left ripples left
    const u = 1 - px;
    const v = 1 - py;

    const prev = trackedHands.get(i);
    if (prev && now - prev.t < 250) {
      const su = prev.u + (u - prev.u) * 0.65; // light smoothing against jitter
      const sv = prev.v + (v - prev.v) * 0.65;
      addStroke(prev.u, prev.v, su, sv, (now - prev.t) / 1000);
      trackedHands.set(i, { u: su, v: sv, t: now });
    } else {
      trackedHands.set(i, { u, v, t: now });
    }
  });
  for (const key of [...trackedHands.keys()]) {
    if (!seen.has(key)) trackedHands.delete(key);
  }

  if (latestHands.length > 0) {
    setStatus(`tracking ${latestHands.length} hand${latestHands.length > 1 ? 's' : ''}`, 'tracking');
  } else {
    setStatus('wave a hand over the water ✋');
  }
}

function drawPreview() {
  if (camWrap.classList.contains('hidden') || !camReady || video.readyState < 2) return;
  const w = preview.width, h = preview.height;
  pctx.save();
  pctx.translate(w, 0);
  pctx.scale(-1, 1);
  pctx.drawImage(video, 0, 0, w, h);
  pctx.restore();

  for (const lm of latestHands) {
    pctx.fillStyle = 'rgba(126, 240, 201, 0.9)';
    for (const p of lm) {
      pctx.beginPath();
      pctx.arc((1 - p.x) * w, p.y * h, 2.5, 0, Math.PI * 2);
      pctx.fill();
    }
    let px = 0, py = 0;
    for (const idx of PALM_POINTS) { px += lm[idx].x; py += lm[idx].y; }
    px /= PALM_POINTS.length; py /= PALM_POINTS.length;
    pctx.fillStyle = '#ffd7f0';
    pctx.beginPath();
    pctx.arc((1 - px) * w, py * h, 5, 0, Math.PI * 2);
    pctx.fill();
  }
}

// ----------------------------------------------------------- mouse fallback
const raycaster = new THREE.Raycaster();
const pointerPt = new THREE.Vector3();
let lastPointer = null;

function pointerToUv(clientX, clientY) {
  const nx = (clientX / window.innerWidth) * 2 - 1;
  const ny = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  if (!raycaster.ray.intersectPlane(groundPlane, pointerPt)) return null;
  return {
    u: (pointerPt.x - worldRect.cx) / worldRect.w + 0.5,
    v: 0.5 - (pointerPt.z - worldRect.cz) / worldRect.h,
  };
}

window.addEventListener('pointermove', (e) => {
  const uv = pointerToUv(e.clientX, e.clientY);
  if (!uv) return;
  const now = performance.now();
  if (lastPointer && now - lastPointer.t < 200) {
    addStroke(lastPointer.u, lastPointer.v, uv.u, uv.v, (now - lastPointer.t) / 1000);
  }
  lastPointer = { ...uv, t: now };
});
window.addEventListener('pointerdown', (e) => {
  const uv = pointerToUv(e.clientX, e.clientY);
  if (uv) addSplat(uv.u, uv.v, 2.2, 0, 0);
});

// --------------------------------------------------------------- main loop
let idleDropAt = 0;
let simAccumulator = 0;
let lastFrame = performance.now();

function stepSimulation() {
  simMaterial.uniforms.uPrev.value = targets[iPrev].texture;
  simMaterial.uniforms.uCurr.value = targets[iCurr].texture;
  renderer.setRenderTarget(targets[iNext]);
  renderer.render(simScene, simCamera);
  [iPrev, iCurr, iNext] = [iCurr, iNext, iPrev];
}

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;

  processHands(now);

  // gentle rain while nobody is interacting, so the surface stays alive
  if (now - lastInteraction > 4000 && now - idleDropAt > 2400) {
    idleDropAt = now;
    addSplat(0.15 + Math.random() * 0.7, 0.15 + Math.random() * 0.7, 0, 0, 0, 0.55);
    lastInteraction = now - 4001; // keep raining until real interaction resumes
  }

  const count = Math.min(splatQueue.length, MAX_SPLATS);
  simMaterial.uniforms.uSplatCount.value = count;
  for (let i = 0; i < count; i++) {
    const s = splatQueue[i];
    simMaterial.uniforms.uSplats.value[i].set(s.u, s.v, s.amp, s.radius);
    simMaterial.uniforms.uSplatDirs.value[i].set(s.dx, s.dy);
  }
  splatQueue.length = 0;

  simAccumulator = Math.min(simAccumulator + dt, 3 / SIM_HZ);
  let first = true;
  while (simAccumulator >= 1 / SIM_HZ) {
    stepSimulation();
    simAccumulator -= 1 / SIM_HZ;
    if (first) { simMaterial.uniforms.uSplatCount.value = 0; first = false; }
  }
  renderer.setRenderTarget(null);

  waterMaterial.uniforms.uHeight.value = targets[iCurr].texture;
  waterMaterial.uniforms.uTime.value = now / 1000;
  renderer.render(scene, camera);

  drawPreview();
}
requestAnimationFrame(animate);
</script>
</body>
</html>
