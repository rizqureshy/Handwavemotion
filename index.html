<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Ink Field</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04050c;
    color: #dfe6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas.scene { display: block; }

  #hud {
    position: fixed;
    top: 18px;
    left: 20px;
    pointer-events: none;
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #cdd8ff;
  }
  #status {
    font-size: 13px;
    color: #8fa0c8;
    transition: color 0.3s;
  }
  #status.tracking { color: #7ef0c9; }
  #status.error { color: #ff9d9d; }

  #hint {
    position: fixed;
    bottom: 16px;
    left: 20px;
    font-size: 12px;
    color: #5d6a8f;
    pointer-events: none;
    user-select: none;
  }

  #camWrap {
    position: fixed;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  #preview {
    width: 176px;
    height: 132px;
    border-radius: 10px;
    border: 1px solid rgba(150, 170, 255, 0.25);
    background: #0a0c18;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  }
  #camWrap.hidden #preview { display: none; }
  #toggleCam {
    pointer-events: auto;
    font: 11px system-ui, sans-serif;
    color: #93a3cc;
    background: rgba(20, 24, 44, 0.7);
    border: 1px solid rgba(150, 170, 255, 0.2);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #toggleCam:hover { color: #d7e0ff; }

  video#cam {
    position: absolute;
    width: 640px;
    height: 480px;
    visibility: hidden;
    pointer-events: none;
  }

  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    font-size: 15px;
    color: #ffb0b0;
    text-align: center;
    padding: 24px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="hud">
    <h1>Ink Field</h1>
    <div id="status">warming up…</div>
  </div>
  <div id="hint">wave a hand to paint — speed throws the ink · mouse draws too · click bursts · press C to toggle camera view</div>
  <div id="camWrap">
    <canvas id="preview" width="352" height="264"></canvas>
    <button id="toggleCam">hide camera</button>
  </div>
  <video id="cam" playsinline muted></video>
  <div id="fatal"></div>

<script type="module">
import * as THREE from 'three';

const RES = 512;                 // particle state texture is RES x RES
const POOL = RES * RES;          // total particles in the recycling pool
const MAX_SEGS = 6;              // max emission segments applied per frame

const statusEl = document.getElementById('status');
function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className = cls;
}
function fatal(text) {
  const el = document.getElementById('fatal');
  el.textContent = text;
  el.style.display = 'grid';
}

// ---------------------------------------------------------------- renderer
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false });
} catch (err) {
  fatal('WebGL2 is not available in this browser — the ink cannot be simulated here.');
  throw err;
}
const DPR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.autoClear = false;
renderer.domElement.classList.add('scene');
document.body.prepend(renderer.domElement);

const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ----------------------------------------------------------- particle state
// Two ping-pong texture pairs hold the pool:
//   posVel: xy = position (canvas uv), zw = velocity (uv/s)
//   meta:   x = birth time, y = lifespan, z = hue, w = size random
// New ink recycles the oldest particles: each emission segment claims a
// contiguous index range [start, start+count) after a moving cursor, and the
// update shaders re-initialize any particle whose index falls inside it.
function makeStateTarget() {
  return new THREE.WebGLRenderTarget(RES, RES, {
    type: THREE.FloatType,
    format: THREE.RGBAFormat,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false,
    generateMipmaps: false,
  });
}
const posVelRT = [makeStateTarget(), makeStateTarget()];
const metaRT = [makeStateTarget(), makeStateTarget()];
let flip = 0; // reads [flip], writes [1 - flip]

const passThroughVS = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const spawnChunk = /* glsl */`
  uniform int uSegCount;
  uniform vec4 uSegA[MAX_SEGS]; // xy: p0, zw: p1 (canvas uv)
  uniform vec4 uSegB[MAX_SEGS]; // xy: inherited velocity, z: start index, w: count
  uniform vec4 uSegC[MAX_SEGS]; // x: hue, y: position jitter, z: velocity spread
  uniform float uSeed;

  float hash(float n) { return fract(sin(n) * 43758.5453123); }
  vec2 hash2(float n) { return fract(sin(vec2(n, n * 1.7)) * vec2(43758.5453, 22578.1459)); }

  float particleIndex(vec2 uv) {
    return floor(uv.y * RES_F) * RES_F + floor(uv.x * RES_F);
  }

  bool findSpawn(float idx, out int seg, out float frac) {
    for (int s = 0; s < MAX_SEGS; s++) {
      if (s >= uSegCount) break;
      float rel = idx - uSegB[s].z;
      if (rel < 0.0) rel += POOL_F;
      if (rel < uSegB[s].w) {
        seg = s;
        frac = (rel + 0.5) / uSegB[s].w;
        return true;
      }
    }
    seg = 0;
    frac = 0.0;
    return false;
  }
`;

const posVelMaterial = new THREE.ShaderMaterial({
  defines: { MAX_SEGS, RES_F: RES.toFixed(1), POOL_F: POOL.toFixed(1) },
  uniforms: {
    uPosVel: { value: null },
    uMeta: { value: null },
    uTime: { value: 0 },
    uDt: { value: 0 },
    uAspect: { value: 1 },
    uSeed: { value: 0 },
    uSegCount: { value: 0 },
    uSegA: { value: Array.from({ length: MAX_SEGS }, () => new THREE.Vector4()) },
    uSegB: { value: Array.from({ length: MAX_SEGS }, () => new THREE.Vector4()) },
    uSegC: { value: Array.from({ length: MAX_SEGS }, () => new THREE.Vector4()) },
  },
  depthTest: false,
  depthWrite: false,
  vertexShader: passThroughVS,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPosVel;
    uniform sampler2D uMeta;
    uniform float uTime;
    uniform float uDt;
    uniform float uAspect;
    ${'' /* spawn chunk is injected below */}
    SPAWN_CHUNK

    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash(dot(i, vec2(127.1, 311.7)));
      float b = hash(dot(i + vec2(1.0, 0.0), vec2(127.1, 311.7)));
      float c = hash(dot(i + vec2(0.0, 1.0), vec2(127.1, 311.7)));
      float d = hash(dot(i + vec2(1.0, 1.0), vec2(127.1, 311.7)));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fnoise(vec2 p, float t) {
      return vnoise(p + vec2(0.0, t)) + 0.5 * vnoise(p * 2.3 - vec2(t * 0.7, 0.0));
    }
    // divergence-free swirl field: this is what pulls the ink apart
    vec2 curl(vec2 p, float t) {
      float e = 0.09;
      float dx = fnoise(p + vec2(e, 0.0), t) - fnoise(p - vec2(e, 0.0), t);
      float dy = fnoise(p + vec2(0.0, e), t) - fnoise(p - vec2(0.0, e), t);
      return vec2(dy, -dx) / (2.0 * e);
    }

    void main() {
      vec4 pv = texture2D(uPosVel, vUv);
      vec4 meta = texture2D(uMeta, vUv);
      float idx = particleIndex(vUv);

      int seg; float frac;
      if (findSpawn(idx, seg, frac)) {
        vec2 jr = (hash2(idx * 0.31 + uSeed) - 0.5) * 2.0;
        jr.x /= uAspect;
        vec2 pos = mix(uSegA[seg].xy, uSegA[seg].zw, frac) + jr * uSegC[seg].y;
        float ang = hash(idx * 0.91 + uSeed) * 6.28318;
        float mag = uSegC[seg].z * (0.25 + 0.75 * hash(idx * 1.37 + uSeed));
        vec2 spread = vec2(cos(ang) / uAspect, sin(ang)) * mag;
        pv = vec4(pos, uSegB[seg].xy + spread);
      } else {
        float age = uTime - meta.x;
        float lifeF = clamp(age / max(meta.y, 1e-4), 0.0, 1.0);
        vec2 wp = vec2(pv.x * uAspect, pv.y);
        vec2 cn = curl(wp * 3.2, uTime * 0.10);
        // young ink follows the stroke; older ink is taken by the swirls
        float disp = mix(0.22, 1.5, smoothstep(0.0, 0.45, lifeF));
        cn.x /= uAspect;
        pv.zw += cn * disp * uDt * 0.32;
        pv.zw *= exp(-uDt * 2.1);
        pv.xy += pv.zw * uDt;
      }

      gl_FragColor = pv;
    }
  `.replace('SPAWN_CHUNK', spawnChunk),
});

const metaMaterial = new THREE.ShaderMaterial({
  defines: { MAX_SEGS, RES_F: RES.toFixed(1), POOL_F: POOL.toFixed(1) },
  uniforms: {
    uMeta: { value: null },
    uTime: { value: 0 },
    uSeed: { value: 0 },
    uSegCount: { value: 0 },
    uSegA: { value: posVelMaterial.uniforms.uSegA.value },
    uSegB: { value: posVelMaterial.uniforms.uSegB.value },
    uSegC: { value: posVelMaterial.uniforms.uSegC.value },
  },
  depthTest: false,
  depthWrite: false,
  vertexShader: passThroughVS,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uMeta;
    uniform float uTime;
    SPAWN_CHUNK

    void main() {
      vec4 meta = texture2D(uMeta, vUv);
      float idx = particleIndex(vUv);
      int seg; float frac;
      if (findSpawn(idx, seg, frac)) {
        float r1 = hash(idx * 0.123 + uSeed);
        float r2 = hash(idx * 0.457 + uSeed * 1.3);
        float r3 = hash(idx * 0.789 + uSeed * 2.1);
        meta = vec4(uTime, 2.8 + 3.2 * r1, uSegC[seg].x + (r2 - 0.5) * 0.16, r3);
      }
      gl_FragColor = meta;
    }
  `.replace('SPAWN_CHUNK', spawnChunk),
});

const quadGeometry = new THREE.PlaneGeometry(2, 2);
const posVelScene = new THREE.Scene();
posVelScene.add(new THREE.Mesh(quadGeometry, posVelMaterial));
const metaScene = new THREE.Scene();
metaScene.add(new THREE.Mesh(quadGeometry, metaMaterial));

// zero-initialized state reads as dead: lifespan 0 hides the particle
renderer.setClearColor(0x000000, 0);
for (const rt of [...posVelRT, ...metaRT]) {
  renderer.setRenderTarget(rt);
  renderer.clear();
}
renderer.setRenderTarget(null);

// ------------------------------------------------------------ ink rendering
// Particles draw additively into a persistence buffer that fades and blurs a
// little every frame — that trail is what makes strokes read as flowing ink.
function makeTrailTarget() {
  return new THREE.WebGLRenderTarget(
    Math.floor(window.innerWidth * DPR),
    Math.floor(window.innerHeight * DPR),
    {
      type: THREE.HalfFloatType,
      format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping,
      wrapT: THREE.ClampToEdgeWrapping,
      depthBuffer: false,
      generateMipmaps: false,
    }
  );
}
let trailRT = [makeTrailTarget(), makeTrailTarget()];
let trailFlip = 0;

const fadeMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTrail: { value: null },
    uTexel: { value: new THREE.Vector2() },
    uFade: { value: 0.975 },
    uDecay: { value: 0.0008 },
    uBlurMix: { value: 0.22 },
  },
  depthTest: false,
  depthWrite: false,
  vertexShader: passThroughVS,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTrail;
    uniform vec2 uTexel;
    uniform float uFade;
    uniform float uDecay;
    uniform float uBlurMix;
    void main() {
      vec3 c = texture2D(uTrail, vUv).rgb;
      vec3 blur = ( texture2D(uTrail, vUv + vec2( uTexel.x * 1.4, 0.0)).rgb
                  + texture2D(uTrail, vUv + vec2(-uTexel.x * 1.4, 0.0)).rgb
                  + texture2D(uTrail, vUv + vec2(0.0,  uTexel.y * 1.4)).rgb
                  + texture2D(uTrail, vUv + vec2(0.0, -uTexel.y * 1.4)).rgb ) * 0.25;
      c = mix(c, blur, uBlurMix);                // ink bleeds outward
      c = max(c * uFade - uDecay, vec3(0.0));    // and dries to nothing
      gl_FragColor = vec4(c, 1.0);
    }
  `,
});
const fadeScene = new THREE.Scene();
fadeScene.add(new THREE.Mesh(quadGeometry, fadeMaterial));

const pointsMaterial = new THREE.ShaderMaterial({
  defines: { RES_F: RES.toFixed(1) },
  uniforms: {
    uPosVel: { value: null },
    uMeta: { value: null },
    uTime: { value: 0 },
    uDpr: { value: DPR },
  },
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false,
  vertexShader: /* glsl */`
    attribute float aIndex;
    uniform sampler2D uPosVel;
    uniform sampler2D uMeta;
    uniform float uTime;
    uniform float uDpr;
    varying float vAlpha;
    varying vec3 vColor;

    vec3 palette(float t) {
      return vec3(0.60, 0.52, 0.58)
           + vec3(0.40, 0.42, 0.40) * cos(6.28318 * (t + vec3(0.00, 0.33, 0.67)));
    }

    void main() {
      vec2 uv = (vec2(mod(aIndex, RES_F), floor(aIndex / RES_F)) + 0.5) / RES_F;
      vec4 pv = texture2D(uPosVel, uv);
      vec4 meta = texture2D(uMeta, uv);
      float lf = (uTime - meta.x) / max(meta.y, 1e-4);
      if (meta.y < 1e-3 || lf >= 1.0 || lf < 0.0) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        gl_PointSize = 0.0;
        vAlpha = 0.0;
        vColor = vec3(0.0);
        return;
      }
      gl_Position = vec4(pv.xy * 2.0 - 1.0, 0.0, 1.0);
      float grow = mix(0.4, 1.2, smoothstep(0.0, 0.5, lf)); // blot spreads with age
      gl_PointSize = (3.5 + 10.0 * meta.w) * grow * uDpr;
      vAlpha = smoothstep(0.0, 0.04, lf) * pow(1.0 - lf, 1.6) * 0.45;
      vColor = palette(meta.z);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying float vAlpha;
    varying vec3 vColor;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      float a = exp(-r2 * 10.0) * smoothstep(0.25, 0.14, r2) * vAlpha;
      gl_FragColor = vec4(vColor * a, a);
    }
  `,
});
const pointsGeometry = new THREE.BufferGeometry();
{
  const indices = new Float32Array(POOL);
  for (let i = 0; i < POOL; i++) indices[i] = i;
  pointsGeometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
  pointsGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(POOL * 3), 3));
}
const points = new THREE.Points(pointsGeometry, pointsMaterial);
points.frustumCulled = false;
const pointsScene = new THREE.Scene();
pointsScene.add(points);

const blitMaterial = new THREE.ShaderMaterial({
  uniforms: { uTrail: { value: null } },
  depthTest: false,
  depthWrite: false,
  vertexShader: passThroughVS,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTrail;
    void main() {
      vec3 ink = texture2D(uTrail, vUv).rgb;
      vec3 col = vec3(0.012, 0.014, 0.030) + (1.0 - exp(-ink * 2.2));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(quadGeometry, blitMaterial));

function clearTrails() {
  renderer.setClearColor(0x000000, 1);
  for (const rt of trailRT) {
    renderer.setRenderTarget(rt);
    renderer.clear();
  }
  renderer.setRenderTarget(null);
}
clearTrails();

function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  for (const rt of trailRT) rt.dispose();
  trailRT = [makeTrailTarget(), makeTrailTarget()];
  clearTrails();
  posVelMaterial.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
}
window.addEventListener('resize', onResize);
onResize();

// ---------------------------------------------------------------- emission
let cursor = 0;
let pendingSegs = [];
let hueBase = Math.random();

function currentHue(offset = 0) {
  return hueBase + performance.now() * 0.000022 + offset;
}

function emitSegment(seg) {
  if (pendingSegs.length >= MAX_SEGS) return;
  pendingSegs.push(seg);
}

// A movement segment from p0 to p1 (canvas uv, v up) with velocity in uv/s.
function emitStroke(p0u, p0v, p1u, p1v, dt, hueOffset) {
  const du = p1u - p0u, dv = p1v - p0v;
  const len = Math.hypot(du, dv);
  const speed = len / Math.max(dt, 1 / 240);
  if (speed < 0.015) return false;
  const count = Math.min(Math.round(80 + len * 4200 + speed * 140), 1400);
  const velScale = Math.min(0.4, 1.0 / Math.max(speed, 1e-4)); // cap thrown ink at 1 uv/s
  emitSegment({
    x0: p0u, y0: p0v, x1: p1u, y1: p1v,
    vx: (du / Math.max(dt, 1 / 240)) * velScale,
    vy: (dv / Math.max(dt, 1 / 240)) * velScale,
    count,
    hue: currentHue(hueOffset) + Math.min(speed * 0.04, 0.08),
    jitter: 0.007,
    spread: 0.05 + Math.min(speed * 0.10, 0.30),
  });
  return true;
}

// A resting hand slowly pools ink instead of drawing a stroke.
function emitDrip(u, v, hueOffset) {
  emitSegment({
    x0: u, y0: v, x1: u, y1: v,
    vx: 0, vy: 0,
    count: 10,
    hue: currentHue(hueOffset),
    jitter: 0.010,
    spread: 0.03,
  });
}

function emitBurst(u, v) {
  emitSegment({
    x0: u, y0: v, x1: u, y1: v,
    vx: 0, vy: 0,
    count: 2200,
    hue: currentHue(Math.random() * 0.2 - 0.1),
    jitter: 0.015,
    spread: 0.45,
  });
}

function uploadSegments() {
  const n = Math.min(pendingSegs.length, MAX_SEGS);
  posVelMaterial.uniforms.uSegCount.value = n;
  metaMaterial.uniforms.uSegCount.value = n;
  for (let i = 0; i < n; i++) {
    const s = pendingSegs[i];
    posVelMaterial.uniforms.uSegA.value[i].set(s.x0, s.y0, s.x1, s.y1);
    posVelMaterial.uniforms.uSegB.value[i].set(s.vx, s.vy, cursor, s.count);
    posVelMaterial.uniforms.uSegC.value[i].set(s.hue, s.jitter, s.spread, 0);
    cursor = (cursor + s.count) % POOL;
  }
  pendingSegs = [];
}

// --------------------------------------------------------------- hand input
const video = document.getElementById('cam');
const preview = document.getElementById('preview');
const pctx = preview.getContext('2d');
const camWrap = document.getElementById('camWrap');
const toggleBtn = document.getElementById('toggleCam');

let landmarker = null;
let camReady = false;
let lastVideoTime = -1;
let latestHands = [];
const trackedHands = new Map(); // hand index -> {u, v, t}

function toggleCamView() {
  camWrap.classList.toggle('hidden');
  toggleBtn.textContent = camWrap.classList.contains('hidden') ? 'show camera' : 'hide camera';
}
toggleBtn.addEventListener('click', toggleCamView);
window.addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') toggleCamView();
});

async function initHandTracking() {
  setStatus('loading hand tracker…');
  const { FilesetResolver, HandLandmarker } = await import(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
  );
  const fileset = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  const options = (delegate) => ({
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate,
    },
    runningMode: 'VIDEO',
    numHands: 2,
    minHandDetectionConfidence: 0.4,
    minHandPresenceConfidence: 0.4,
    minTrackingConfidence: 0.4,
  });
  try {
    landmarker = await HandLandmarker.createFromOptions(fileset, options('GPU'));
  } catch {
    landmarker = await HandLandmarker.createFromOptions(fileset, options('CPU'));
  }

  setStatus('requesting camera…');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
  camReady = true;
  setStatus('wave a hand to paint ✋');
}
initHandTracking().catch((err) => {
  console.warn('hand tracking unavailable:', err);
  setStatus('camera unavailable — draw with your mouse instead', 'error');
});

// Palm center: average of wrist and the four finger base knuckles.
const PALM_POINTS = [0, 5, 9, 13, 17];

function processHands(now) {
  if (!landmarker || !camReady || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const result = landmarker.detectForVideo(video, now);
  latestHands = result.landmarks || [];

  const seen = new Set();
  latestHands.forEach((lm, i) => {
    seen.add(i);
    let px = 0, py = 0;
    for (const idx of PALM_POINTS) { px += lm[idx].x; py += lm[idx].y; }
    px /= PALM_POINTS.length; py /= PALM_POINTS.length;

    // mirror the camera so moving your hand left paints left
    const u = 1 - px;
    const v = 1 - py;
    const hueOffset = i * 0.13;

    const prev = trackedHands.get(i);
    if (prev && now - prev.t < 600) {
      const su = prev.u + (u - prev.u) * 0.65; // light smoothing against jitter
      const sv = prev.v + (v - prev.v) * 0.65;
      const drew = emitStroke(prev.u, prev.v, su, sv, (now - prev.t) / 1000, hueOffset);
      if (!drew) emitDrip(su, sv, hueOffset);
      trackedHands.set(i, { u: su, v: sv, t: now });
    } else {
      trackedHands.set(i, { u, v, t: now });
    }
  });
  for (const key of [...trackedHands.keys()]) {
    if (!seen.has(key)) trackedHands.delete(key);
  }

  if (latestHands.length > 0) {
    setStatus(`painting with ${latestHands.length} hand${latestHands.length > 1 ? 's' : ''}`, 'tracking');
  } else {
    setStatus('wave a hand to paint ✋');
  }
}

function drawPreview() {
  if (camWrap.classList.contains('hidden') || !camReady || video.readyState < 2) return;
  const w = preview.width, h = preview.height;
  pctx.save();
  pctx.translate(w, 0);
  pctx.scale(-1, 1);
  pctx.drawImage(video, 0, 0, w, h);
  pctx.restore();

  for (const lm of latestHands) {
    pctx.fillStyle = 'rgba(126, 240, 201, 0.9)';
    for (const p of lm) {
      pctx.beginPath();
      pctx.arc((1 - p.x) * w, p.y * h, 2.5, 0, Math.PI * 2);
      pctx.fill();
    }
    let px = 0, py = 0;
    for (const idx of PALM_POINTS) { px += lm[idx].x; py += lm[idx].y; }
    px /= PALM_POINTS.length; py /= PALM_POINTS.length;
    pctx.fillStyle = '#ffd7f0';
    pctx.beginPath();
    pctx.arc((1 - px) * w, py * h, 5, 0, Math.PI * 2);
    pctx.fill();
  }
}

// ----------------------------------------------------------- mouse fallback
// The latest pointer position is consumed once per animation frame, so the
// stroke stays correct regardless of event timing or frame rate.
let pointerNow = null;
let pointerPrev = null;

function pointerToUv(e) {
  return { u: e.clientX / window.innerWidth, v: 1 - e.clientY / window.innerHeight };
}
window.addEventListener('pointermove', (e) => {
  pointerNow = pointerToUv(e);
});
function processPointer(dt) {
  if (pointerNow && pointerPrev) {
    emitStroke(pointerPrev.u, pointerPrev.v, pointerNow.u, pointerNow.v, dt, 0.05);
  }
  pointerPrev = pointerNow;
}
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#camWrap')) return;
  const uv = pointerToUv(e);
  emitBurst(uv.u, uv.v);
});

// --------------------------------------------------------------- main loop
let lastFrame = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const t = now / 1000;
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  processHands(now);
  processPointer(dt);

  // advance the particle pool: meta first (same spawn ranges), then pos/vel
  uploadSegments();
  const seed = Math.random() * 100;
  metaMaterial.uniforms.uMeta.value = metaRT[flip].texture;
  metaMaterial.uniforms.uTime.value = t;
  metaMaterial.uniforms.uSeed.value = seed;
  renderer.setRenderTarget(metaRT[1 - flip]);
  renderer.render(metaScene, quadCamera);

  posVelMaterial.uniforms.uPosVel.value = posVelRT[flip].texture;
  posVelMaterial.uniforms.uMeta.value = metaRT[flip].texture;
  posVelMaterial.uniforms.uTime.value = t;
  posVelMaterial.uniforms.uDt.value = dt;
  posVelMaterial.uniforms.uSeed.value = seed;
  renderer.setRenderTarget(posVelRT[1 - flip]);
  renderer.render(posVelScene, quadCamera);
  flip = 1 - flip;

  // persistence buffer: fade + bleed the old ink, then stamp the particles
  const trailPrev = trailRT[trailFlip], trailNext = trailRT[1 - trailFlip];
  fadeMaterial.uniforms.uTrail.value = trailPrev.texture;
  fadeMaterial.uniforms.uTexel.value.set(1 / trailPrev.width, 1 / trailPrev.height);
  // time-based so the ink dries at the same rate on 30Hz and 120Hz displays
  fadeMaterial.uniforms.uFade.value = Math.pow(0.22, dt);
  fadeMaterial.uniforms.uDecay.value = 0.048 * dt;
  fadeMaterial.uniforms.uBlurMix.value = Math.min(13.2 * dt, 0.45);
  renderer.setRenderTarget(trailNext);
  renderer.render(fadeScene, quadCamera);

  pointsMaterial.uniforms.uPosVel.value = posVelRT[flip].texture;
  pointsMaterial.uniforms.uMeta.value = metaRT[flip].texture;
  pointsMaterial.uniforms.uTime.value = t;
  renderer.render(pointsScene, quadCamera);
  trailFlip = 1 - trailFlip;

  renderer.setRenderTarget(null);
  blitMaterial.uniforms.uTrail.value = trailNext.texture;
  renderer.render(blitScene, quadCamera);

  drawPreview();
}
requestAnimationFrame(animate);
</script>
</body>
</html>
