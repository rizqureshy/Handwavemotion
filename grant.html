<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Handwave — camera access</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #04050c;
    color: #dfe6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 460px; padding: 32px; text-align: center; }
  h1 {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #cdd8ff;
  }
  #status { font-size: 15px; line-height: 1.55; color: #8fa0c8; min-height: 48px; }
  #status.ok { color: #7ef0c9; }
  #status.error { color: #ff9d9d; }
  #hintBox {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    text-align: left;
    font-size: 13.5px;
    line-height: 1.6;
    color: #9fb0d8;
    background: rgba(20, 24, 44, 0.7);
    border: 1px solid rgba(150, 170, 255, 0.2);
    border-radius: 10px;
  }
  button {
    margin-top: 20px;
    font: 14px system-ui, sans-serif;
    color: #dfe6ff;
    background: rgba(20, 24, 44, 0.9);
    border: 1px solid rgba(150, 170, 255, 0.35);
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
  }
  button:hover { border-color: #56d9ff; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Handwave</h1>
  <div id="status">Requesting camera access…</div>
  <div id="hintBox"></div>
  <button id="retry">Try again</button>
</main>
<script src="grant.js"></script>
</body>
</html>
